<!doctype html>
<html><head><meta charset="utf-8"><title>Loan Management System</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:1050px;margin:0 auto;padding:1rem}
  nav a{margin-right:1.2rem;font-weight:600}
  table{border-collapse:collapse;width:100%;margin:1rem 0}
  th,td{border:1px solid #ccc;padding:.4rem .6rem;text-align:left}
  th{background:#f2f2f2}
  input,select,button{padding:.35rem;margin:.15rem}
  .msg{background:#eef2ff;border-left:4px solid #4f46e5;padding:.5rem .8rem;margin:.4rem 0}
  form.inline{display:inline}
</style></head><body>
<h1>Loan Management System</h1>
<nav><a href="{{ url_for('borrowers') }}">Borrowers</a>
     <a href="{{ url_for('loans') }}">Loans</a>
     <a href="{{ url_for('reports') }}">Reports</a></nav><hr>
{% for m in get_flashed_messages() %}<div class="msg">{{ m }}</div>{% endfor %}
{% block body %}{% endblock %}
</body></html>

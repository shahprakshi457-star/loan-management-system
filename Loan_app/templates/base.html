<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loan Management System</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <span class="brand">Loan Management System</span>
    <nav>
      <a href="{{ url_for('borrowers') }}"
         class="{{ 'active' if request.endpoint in ('borrowers', 'edit_borrower') }}">Borrowers</a>
      <a href="{{ url_for('loans') }}"
         class="{{ 'active' if request.endpoint in ('loans', 'loan_detail') }}">Loans</a>
      <a href="{{ url_for('reports') }}"
         class="{{ 'active' if request.endpoint == 'reports' }}">Reports</a>
    </nav>
  </div>
</header>
<main class="wrap">
  {% for m in get_flashed_messages() %}<div class="msg">{{ m }}</div>{% endfor %}
  {% block body %}{% endblock %}
</main>
<footer>BACSE202 - Database Systems</footer>
</body>
</html>

{% extends "base.html" %}{% block body %}
<h2>Borrowers</h2>
<h3>Add borrower</h3>
<form method="post">
  <input name="full_name" placeholder="Full name" required>
  <input type="date" name="dob" required>
  <input name="phone" placeholder="Phone (10 digits)" required>
  <input name="email" placeholder="Email (optional)">
  <input name="line1" placeholder="Address line" required>
  <select name="pincode">{% for a in areas %}
    <option value="{{ a.pincode }}">{{ a.pincode }} – {{ a.city }}</option>{% endfor %}</select>
  <button>Add</button>
</form>
<form method="get"><input name="q" value="{{ q }}" placeholder="Search name or phone">
  <button>Search</button></form>
<table>
  <tr><th>ID</th><th>Name</th><th>DOB</th><th>Phones</th><th>Emails</th><th>Address</th><th></th></tr>
  {% for r in rows %}<tr>
    <td>{{ r.borrower_id }}</td><td>{{ r.full_name }}</td><td>{{ r.dob }}</td>
    <td>{{ r.phones }}</td><td>{{ r.emails or '' }}</td><td>{{ r.address }}</td>
    <td><a href="{{ url_for('edit_borrower', bid=r.borrower_id) }}">Edit</a>
      <form class="inline" method="post" action="{{ url_for('delete_borrower', bid=r.borrower_id) }}"
            onsubmit="return confirm('Delete this borrower?')"><button>Delete</button></form></td>
  </tr>{% endfor %}
</table>{% endblock %}
